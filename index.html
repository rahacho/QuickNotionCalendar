    <script>
      // Apply the theme before first paint (no flash). Mirrors useApplyTheme(): per-device preference in
      // localStorage 'tasks.theme' ("system" | "light" | "dark", raw or JSON-quoted), else the OS setting.
      (function () {
        var pref = 'system';
        try {
          var raw = localStorage.getItem('tasks.theme');
          if (raw) pref = raw.replace(/"/g, '');
        } catch (e) {}
        var dark =
          pref === 'dark' ||
          (pref !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
    <script>
      // Status bar / browser chrome follow a forced per-device theme from the very first frame.
      (function () {
        var dark = document.documentElement.getAttribute('data-theme') === 'dark';
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', dark ? '#191919' : '#ffffff');
      })();
    </script>
    <style>
      /* Pre-CSS canvas in the resolved theme (avoids a white flash in dark mode while the app loads). */
      html { background: #ffffff; color-scheme: light; }
      html[data-theme='dark'] { background: #191919; color-scheme: dark; }
    </style>
  </head>
  <body>
    <div id="root"></div>

  </body>
